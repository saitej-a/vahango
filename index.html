<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VahanGo - Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at bottom, #020202 0%, #0b0b0b 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      position: relative;
    }

    /* Starfield background */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkleMove 10s infinite ease-in-out;
    }

    @keyframes twinkleMove {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-10px) scale(1.3); opacity: 1; }
    }

    /* Vehicle icons (simplified) */
    .vehicle {
      position: absolute;
      opacity: 0.15;
      filter: blur(4px);
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .content {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      color: #fff;
      position: relative;
      z-index: 3;
      display: inline-block;
      padding: 20px 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      overflow: hidden;
      cursor: pointer;
    }

    h1::before {
      content: '';
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      transform: skewX(-25deg);
      transition: left 0.7s ease;
      z-index: -1;
    }

    h1:hover::before {
      left: 125%;
    }

    h1:hover {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(25px) brightness(1.3);
    }
  </style>
</head>

    <h1>COMING SOON</h1>
