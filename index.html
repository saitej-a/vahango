<!DOCTYPE html>
<html lang="""en
<head>
    <meta charset="UTF-8">
    <title>VahanGo - Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a2239;
            color: #fff;
        }
        body {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: #ffb400;
            text-shadow: 0 2px 16px #0008;
            z-index: 2;
            user-select: none;
        }
        .coming-soon {
            position: relative;
            z-index: 2;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-top: 120px;
            padding: 32px 48px;
            background: rgba(10,34,57,0.7);
            border-radius: 24px;
            box-shadow: 0 4px 32px #0005;
            border: 2px solid #ffb400;
            text-shadow: 0 2px 8px #0006;
            user-select: none;
        }
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">VahanGo</div>
    <canvas id="bg-canvas"></canvas>
    <div class="coming-soon">Coming Soon</div>
    <script>
        // Canvas setup
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w = window.innerWidth, h = window.innerHeight;
        function resize() {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
        }
        window.addEventListener('resize', resize);
        resize();

        // Floating particles
        const particles = Array.from({length: 60}, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: 1 + Math.random() * 2.5,
            dx: -0.2 + Math.random() * 0.4,
            dy: -0.1 + Math.random() * 0.2,
            alpha: 0.2 + Math.random() * 0.5
        }));

        // Simple vehicle SVGs
        const vehicleSVGs = [
            `<svg width="60" height="28" viewBox="0 0 60 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="10" width="36" height="10" rx="4" fill="#3ec6e0"/>
                <rect x="44" y="13" width="10" height="7" rx="2" fill="#ffb400"/>
                <circle cx="16" cy="22" r="4" fill="#222"/>
                <circle cx="44" cy="22" r="4" fill="#222"/>
            </svg>`,
            `<svg width="50" height="22" viewBox="0 0 50 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="8" width="28" height="8" rx="3" fill="#ff5e5b"/>
                <rect x="34" y="10" width="8" height="6" rx="2" fill="#3ec6e0"/>
                <circle cx="14" cy="18" r="3" fill="#222"/>
                <circle cx="34" cy="18" r="3" fill="#222"/>
            </svg>`,
            `<svg width="40" height="18" viewBox="0 0 40 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="6" width="20" height="6" rx="2" fill="#bada55"/>
                <rect x="24" y="8" width="6" height="4" rx="1" fill="#ffb400"/>
                <circle cx="10" cy="14" r="2.5" fill="#222"/>
                <circle cx="24" cy="14" r="2.5" fill="#222"/>
            </svg>`
        ];

        // Vehicles floating
        const vehicles = Array.from({length: 5}, (_, i) => ({
            svg: vehicleSVGs[i % vehicleSVGs.length],
            x: Math.random() * w,
            y: 80 + Math.random() * (h - 200),
            scale: 0.7 + Math.random() * 0.7,
            speed: 0.2 + Math.random() * 0.15,
            floatPhase: Math.random() * Math.PI * 2
        }));

        function drawParticles() {
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
                ctx.fillStyle = "#fff";
                ctx.shadowColor = "#fff";
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();

                p.x += p.dx;
                p.y += p.dy;
                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;
            }
        }

        function drawVehicles(t) {
            vehicles.forEach(v => {
                // Animate horizontal movement
                v.x += v.speed;
                if (v.x > w + 60) v.x = -60;
                // Animate floating
                const floatY = Math.sin(t / 900 + v.floatPhase) * 12;
                // Draw SVG
                const img = new window.Image();
                const svg64 = btoa(v.svg);
                img.src = 'data:image/svg+xml;base64,' + svg64;
                ctx.save();
                ctx.globalAlpha = 0.55;
                ctx.translate(v.x, v.y + floatY);
                ctx.scale(v.scale, v.scale);
                ctx.drawImage(img, 0, 0);
                ctx.restore();
            });
        }

        function animate(t) {
            ctx.clearRect(0, 0, w, h);
            drawParticles();
            drawVehicles(t || 0);
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>"></html>
